# Labeler v4 configuration for GitHub Actions PR labeling

'area: flow':
  - changed-files:
      - any-glob-to-any-file: 'src/flow/**/*'

'area: capture':
  - changed-files:
      - any-glob-to-any-file: 'src/capture/**/*'

'area: ui':
  - changed-files:
      - any-glob-to-any-file: 'src/ui/**/*'

'area: config':
  - changed-files:
      - any-glob-to-any-file: 'src/config/**/*'

'area: dns':
  - changed-files:
      - any-glob-to-any-file: 'src/dns/**/*'

'area: top':
  - changed-files:
      - any-glob-to-any-file: 'src/top/**/*'

'area: tests':
  - changed-files:
      - any-glob-to-any-file: 'tests/**/*'

'area: docs':
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**/*'
          - '*.md'

'area: ci':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**/*'
          - 'scripts/**/*'
