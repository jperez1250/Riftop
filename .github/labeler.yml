# Labeler configuration for GitHub Actions PR labeling (v5 schema)

'area: flow':
  - changed-files:
      - 'src/flow/**/*'

'area: capture':
  - changed-files:
      - 'src/capture/**/*'

'area: ui':
  - changed-files:
      - 'src/ui/**/*'

'area: config':
  - changed-files:
      - 'src/config/**/*'

'area: dns':
  - changed-files:
      - 'src/dns/**/*'

'area: top':
  - changed-files:
      - 'src/top/**/*'

'area: tests':
  - changed-files:
      - 'tests/**/*'

'area: docs':
  - changed-files:
      - 'docs/**/*'
      - '*.md'

'area: ci':
  - changed-files:
      - '.github/**/*'
      - 'scripts/**/*'
