# Labeler configuration for GitHub Actions PR labeling (actions/labeler@v5)

'area: flow':
  - changed-files:
      - AnyGlobToAnyInList: ['src/flow/**/*']

'area: capture':
  - changed-files:
      - AnyGlobToAnyInList: ['src/capture/**/*']

'area: ui':
  - changed-files:
      - AnyGlobToAnyInList: ['src/ui/**/*']

'area: config':
  - changed-files:
      - AnyGlobToAnyInList: ['src/config/**/*']

'area: dns':
  - changed-files:
      - AnyGlobToAnyInList: ['src/dns/**/*']

'area: top':
  - changed-files:
      - AnyGlobToAnyInList: ['src/top/**/*']

'area: tests':
  - changed-files:
      - AnyGlobToAnyInList: ['tests/**/*']

'area: docs':
  - changed-files:
      - AnyGlobToAnyInList: ['docs/**/*', '*.md']

'area: ci':
  - changed-files:
      - AnyGlobToAnyInList: ['.github/**/*', 'scripts/**/*']
