name: "Pull Request Labeler"

on:
  pull_request:
    branches: [ main, master ]

jobs:
  label:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Labeler
        uses: actions/labeler@v5
